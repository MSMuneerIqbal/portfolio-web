<svg width="256" height="256" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mi-grad" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="mi-glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#0b0b16"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#mi-glow)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#mi-grad)" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Circuit traces -->
  <path d="M8 18 H14 L18 14 H24" stroke="url(#mi-grad)" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>
  <path d="M56 46 H50 L46 50 H40" stroke="url(#mi-grad)" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="18" r="1.3" fill="#a855f7" fill-opacity="0.6"/>
  <circle cx="56" cy="46" r="1.3" fill="#22d3ee" fill-opacity="0.6"/>

  <!-- M as agent network -->
  <path d="M14 46 V22 L25 36 L36 22 V46" stroke="url(#mi-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- I -->
  <path d="M47 27 V46" stroke="url(#mi-grad)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Network nodes -->
  <circle cx="14" cy="22" r="3" fill="#0b0b16" stroke="#a855f7" stroke-width="1.6"/>
  <circle cx="36" cy="22" r="3" fill="#0b0b16" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="25" cy="36" r="2.4" fill="#0b0b16" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="47" cy="19.5" r="3.2" fill="#22d3ee"/>
  <circle cx="47" cy="19.5" r="5.4" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2"/>
</svg>
